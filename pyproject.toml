[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkpulse"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "LinkedIn Post Generator Backend"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/linkpulse"
"Bug Tracker" = "https://github.com/yourusername/linkpulse/issues"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
addopts = "-v"
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["app"] 